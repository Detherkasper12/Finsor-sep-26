name: finsor
description: "Finsor - The Ultimate AI-Powered Personal Finance App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  
  # Localization
  flutter_localizations:
    sdk: flutter
  
  # UI & Icons
  cupertino_icons: ^1.0.6
  gap: ^3.0.1
  material_design_icons_flutter: ^7.0.7296
  
  # Charts & Visualization
  fl_chart: ^0.65.0
  
  # Backend & Database (NEW!)
  supabase_flutter: ^2.5.0  # ← ДОБАВЬ ЭТО
  
  # Local Storage & Data (NEW!)
  hive: ^2.2.3  # ← ДОБАВЬ ЭТО (для кэширования)
  hive_flutter: ^1.1.0  # ← ДОБАВЬ ЭТО
  path_provider: ^2.1.3  # ← ДОБАВЬ ЭТО (для путей к файлам)
  
  # Storage & Data (EXISTING)
  shared_preferences: ^2.2.2
  
  # Network & API
  http: ^1.1.2
  
  # Utilities
  intl: ^0.20.2
  uuid: ^4.2.1
  
  # Animations
  lottie: ^2.7.0

  # In-App Purchases
  in_app_purchase: ^3.2.0

  # Observability
  sentry_flutter: ^9.12.0

  # Security
  crypto: ^3.0.3
  local_auth: ^2.1.8

  # Auth providers
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.4

  # Environment
  flutter_dotenv: ^5.2.1

  # Deep links
  app_links: ^6.3.2

  # File handling
  file_picker: ^8.0.0
  share_plus: ^10.0.0
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1  # ← ДОБАВЬ (для генерации адаптеров Hive)
  build_runner: ^2.4.8  # ← ДОБАВЬ (для code generation)

flutter:
  uses-material-design: true

  assets:
    - .env.dev
    - .env.prod
